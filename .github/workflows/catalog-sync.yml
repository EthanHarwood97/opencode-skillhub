name: catalog-sync
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - run: npm install
      - run: npm run catalog:build -- --fixtures fixtures/skills --out catalog
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: catalog/
